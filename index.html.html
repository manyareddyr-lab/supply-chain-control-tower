  <style>
:root {
  --aquamarine: #0f3f49;
  --aquamarine-dark: #0a2b32;
  --aquamarine-mid: #16525e;
  --aquamarine-muted: rgba(15, 63, 73, 0.14);
  --concrete: #ece6df;
  --concrete-light: #f5f1ec;
  --concrete-dim: #dcd4ca;
  --burgundy: #7f0508;
  --burgundy-muted: rgba(127, 5, 8, 0.12);
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--aquamarine);
  color: var(--concrete);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
  overflow-x: hidden;
}

/* Editorial Typography */
.serif-title {
  font-family: var(--font-serif);
  font-weight: 700;
  letter-spacing: -0.015em;
}

.kpi-number {
  font-family: var(--font-serif);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

/* Flat Editorial Cards */
.concrete-card {
  background-color: var(--concrete);
  color: var(--aquamarine);
  border: 1px solid rgba(15, 63, 73, 0.22);
  border-radius: 3px;
  padding: 1.15rem 1.3rem;
  transition: border-color 0.18s ease, transform 0.18s ease;
}

.concrete-card-light {
  background-color: var(--concrete-light);
  color: var(--aquamarine);
  border: 1px solid rgba(15, 63, 73, 0.18);
  border-radius: 3px;
  padding: 1rem 1.2rem;
}

.aqua-panel {
  background-color: var(--aquamarine-dark);
  color: var(--concrete);
  border: 1px solid rgba(236, 230, 223, 0.22);
  border-radius: 3px;
  padding: 1.15rem 1.3rem;
}

/* Alert Badges */
.tier-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.2rem 0.55rem;
  border-radius: 2px;
}

.tier-badge-0 {
  background-color: rgba(15, 63, 73, 0.12);
  color: var(--aquamarine);
  border: 1px solid rgba(15, 63, 73, 0.3);
}

.tier-badge-1 {
  background-color: rgba(127, 5, 8, 0.12);
  color: var(--burgundy);
  border: 1px solid rgba(127, 5, 8, 0.4);
}

.tier-badge-2 {
  background-color: rgba(127, 5, 8, 0.25);
  color: var(--burgundy);
  border: 1px solid var(--burgundy);
}

.tier-badge-3 {
  background-color: var(--burgundy);
  color: var(--concrete);
  border: 1px solid var(--burgundy);
}

/* Buttons */
.btn-editorial {
  font-family: var(--font-sans);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 0.48rem 0.9rem;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid var(--aquamarine);
  background-color: transparent;
  color: var(--aquamarine);
}

.btn-editorial:hover {
  background-color: var(--aquamarine);
  color: var(--concrete);
}

.btn-editorial-active {
  background-color: var(--aquamarine);
  color: var(--concrete);
}

.btn-burgundy {
  font-family: var(--font-sans);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 0.48rem 0.95rem;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid var(--burgundy);
  background-color: var(--burgundy);
  color: var(--concrete);
}

.btn-burgundy:hover {
  opacity: 0.9;
}

/* Vertical Draggable Disruption Lever Track */
.lever-track {
  position: relative;
  width: 58px;
  height: 230px;
  background-color: var(--concrete-dim);
  border: 2px solid var(--aquamarine);
  border-radius: 4px;
  margin: 0 auto;
  cursor: ns-resize;
  user-select: none;
}

.lever-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--burgundy);
  transition: height 0.08s cubic-bezier(0.22, 1, 0.36, 1);
}

.lever-handle {
  position: absolute;
  left: -12px;
  right: -12px;
  height: 28px;
  background-color: var(--aquamarine);
  color: var(--concrete);
  border: 2px solid var(--concrete);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
  transition: bottom 0.08s cubic-bezier(0.22, 1, 0.36, 1);
}

.lever-handle.active-alert {
  background-color: var(--burgundy);
}

/* Custom Range Sliders */
input[type="range"].editorial-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  background: var(--concrete-dim);
  border: 1px solid rgba(15, 63, 73, 0.3);
  border-radius: 2px;
  outline: none;
}

input[type="range"].editorial-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  background: var(--aquamarine);
  border: 2px solid var(--concrete);
  border-radius: 2px;
  cursor: pointer;
}

/* Heatmap Grid */
.heatmap-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 4px;
}

.heatmap-cell {
  padding: 0.45rem 0.5rem;
  border-radius: 2px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease, background-color 0.15s ease;
  min-width: 84px;
  position: relative;
}

.heatmap-cell:hover {
  transform: translateY(-2px);
  outline: 2px solid var(--aquamarine);
}

.heatmap-cell.selected-cell {
  outline: 2px solid var(--burgundy);
}

/* Tables */
.editorial-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.editorial-table th {
  text-align: left;
  padding: 0.65rem 0.75rem;
  border-bottom: 2px solid var(--aquamarine);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--aquamarine);
}

.editorial-table td {
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid rgba(15, 63, 73, 0.15);
}

.editorial-table tr:hover td {
  background-color: rgba(15, 63, 73, 0.05);
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(15, 63, 73, 0.08);
}
::-webkit-scrollbar-thumb {
  background: rgba(15, 63, 73, 0.35);
  border-radius: 2px;
}

/**
 * Core Supply Chain Analytics & Multi-Agent Engine
 * Runs 100% client-side in <5ms so interactive levers update KPIs, heatmaps, and alerts instantaneously.
 */

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

/**
 * Linear color interpolation between Concrete (#ece6df) at s=0 and Burgundy (#7f0508) at s=1
 * Healthy items (stock > ROP, s === 0) use Aquamarine/Concrete tint.
 */
function getHeatmapStyle(severity, isHealthy) {
  if (isHealthy) {
    return {
      backgroundColor: '#e1ded6',
      borderColor: 'rgba(15, 63, 73, 0.25)',
      color: '#0f3f49'
    };
  }
  const s = clamp(severity, 0, 1);
  // Concrete #ece6df -> RGB(236, 230, 223)
  // Burgundy #7f0508 -> RGB(127, 5, 8)
  const r = Math.round(236 + s * (127 - 236));
  const g = Math.round(230 + s * (5 - 230));
  const b = Math.round(223 + s * (8 - 223));

  return {
    backgroundColor: `rgb(${r}, ${g}, ${b})`,
    borderColor: s > 0.5 ? '#7f0508' : 'rgba(127, 5, 8, 0.35)',
    color: s > 0.5 ? '#ece6df' : '#0f3f49'
  };
}

/**
 * AGENT 1 (Sentinel) + AGENT 2 (Financial Analyst) + AGENT 3 (Scenario Planner) per SKU-Region lane
 */
function evaluateLane(lane, levers, currentStockOverride, weights = { cost: 60, sla: 40 }, freightRates = {}) {
  const {
    disruptionDays = 0,       // 0 to +15 extra lead-time days
    demandSurgePct = 0,       // -30% to +80%
    zScore = 1.65,            // Safety stock z-multiplier (default 1.65)
    supplierReliabilityPct = 100, // 40% to 100% relative reliability
    freightMultiplier = 1.0   // 0.8x to 2.5x
  } = levers;

  // Effective daily demand (d) and std dev (sigma_d)
  const dMultiplier = Math.max(0.1, 1 + demandSurgePct / 100);
  const d = lane.daily_demand * dMultiplier;
  const sigma_d = lane.sigma_d * dMultiplier;

  // Effective reliability penalty adds lead time variance when supplier reliability drops below baseline
  const reliabilityFactor = clamp(supplierReliabilityPct / 100, 0.3, 1.2);
  const reliabilityExtraDays = (1 - reliabilityFactor) * 6.0;

  // Effective lead time L in days
  const L = Math.max(0.5, lane.base_lead_time + disruptionDays + reliabilityExtraDays);

  // Safety stock SS = z * sigma_d * sqrt(L)
  const SS = zScore * sigma_d * Math.sqrt(L);

  // Reorder point ROP = d*L + SS
  const ROP = d * L + SS;

  // Current stock on hand (drawn down by Replay Clock if active, plus in-transit pipeline erosion when extra disruption days delay expected arrivals)
  const baseStock = currentStockOverride !== undefined ? Math.max(0, currentStockOverride) : lane.initial_stock;
  const transitErosion = disruptionDays * d * 0.42;
  const stock = Math.max(0, baseStock - transitErosion);

  // Days of cover = stock / d
  const daysOfCover = d > 0 ? stock / d : 999;

  // Severity s = clamp(1 - stock/ROP, 0, 1)
  const isHealthy = stock > ROP;
  const severity = isHealthy ? 0 : clamp(1 - stock / Math.max(1, ROP), 0, 1);

  // Determine Alert Tier
  // Tier 3 EMERGENCY: days of cover < fastest mitigation lead time OR stock <= 0.5*SS
  // Tier 2 CRITICAL: stock <= SS
  // Tier 1 WATCH: stock <= ROP
  let tier = 0;
  let tierLabel = 'HEALTHY';
  let tierTriggerReason = 'Stock above Reorder Point (ROP)';

  if (daysOfCover < lane.fastest_mitigation_lead_time || stock <= 0.5 * SS) {
    tier = 3;
    tierLabel = 'TIER 3 · EMERGENCY';
    tierTriggerReason = daysOfCover < lane.fastest_mitigation_lead_time
      ? `Days of cover (${daysOfCover.toFixed(1)}d) < fastest mitigation lead time (${lane.fastest_mitigation_lead_time}d)`
      : `Stock (${Math.round(stock)}) <= 0.5 * Safety Stock (${Math.round(0.5 * SS)})`;
  } else if (stock <= SS) {
    tier = 2;
    tierLabel = 'TIER 2 · CRITICAL';
    tierTriggerReason = `Stock (${Math.round(stock)}) <= Safety Stock (${Math.round(SS)})`;
  } else if (stock <= ROP) {
    tier = 1;
    tierLabel = 'TIER 1 · WATCH';
    tierTriggerReason = `Stock (${Math.round(stock)}) <= Reorder Point (${Math.round(ROP)})`;
  }

  // Risk Model probability adjusted dynamically by extra lead time & delay variance
  const dynamicLateProb = clamp(
    lane.model_risk_prob + (disruptionDays * 0.028) + ((1 - reliabilityFactor) * 0.22),
    0.05,
    0.99
  );

  // Composite Alert Score (0-100) combining severity and ML late delivery risk probability
  const alertScore = Math.round((severity * 0.72 + dynamicLateProb * 0.28) * 100);

  // AGENT 2: FINANCIAL ANALYST FORMULAS
  // Shortfall units during lead time = max(0, d*L - stock)
  const shortfallUnits = Math.max(0, d * L - stock);
  const orderQtyNeeded = Math.max(Math.round(ROP - stock + d * 3), Math.round(d * 5));

  // Revenue at Risk = max(0, d*L - stock) * unit price
  const revenueAtRisk = shortfallUnits * lane.unit_price;

  // Lost Margin = Revenue at Risk * margin_ratio
  const lostMargin = revenueAtRisk * lane.margin_ratio;

  // Value of orders expected late = (d * L * unit_price) * dynamicLateProb (when disrupted or below ROP)
  const activePipelineOrderValue = d * L * lane.unit_price;
  const lateOrderExposure = isHealthy
    ? activePipelineOrderValue * lane.empirical_late_rate * 0.15
    : activePipelineOrderValue * dynamicLateProb;

  // SLA penalty = penalty rate * value of orders expected late
  const slaPenalty = lane.sla_penalty_rate * lateOrderExposure;

  // AGENT 3: SCENARIO PLANNER — Compare 4 Mitigation Options
  const baseFreightPerUnit = (freightRates[lane.dominant_ship_mode]?.base_per_unit || 4.2) +
                             (freightRates[lane.dominant_ship_mode]?.handling_per_unit || 1.1);
  const baselineShippingCost = orderQtyNeeded * baseFreightPerUnit;

  const daysSavedAir = Math.min(L - 1.0, Math.max(2.5, L * 0.62));
  const daysSavedReroute = Math.min(L - 1.5, Math.max(1.5, L * 0.38));
  const daysSavedAltSupplier = Math.min(L - 1.2, Math.max(2.0, L * 0.48));

  const rawOptions = [
    {
      id: 'air_expedite',
      name: 'Air Expedite (Same-Day / Next-Flight Charter)',
      shortName: 'Air Expedite',
      hubUsed: lane.warehouse_hub,
      supplierUsed: lane.primary_supplier,
      daysSaved: Number(daysSavedAir.toFixed(1)),
      effectiveLeadTime: Number(Math.max(1.0, L - daysSavedAir).toFixed(1)),
      freightPerUnit: 19.8 * freightMultiplier,
      expeditePremiumPerUnit: 9.2 * freightMultiplier,
      handlingPerUnit: 2.6,
      slaPreservationScore: 96,
      residualExposureRatio: 0.06,
      holdingDaysAdded: 1.0
    },
    {
      id: 'reroute_hub',
      name: `Re-route via ${lane.alternate_hub}`,
      shortName: 'Re-route Region/Hub',
      hubUsed: lane.alternate_hub,
      supplierUsed: lane.primary_supplier,
      daysSaved: Number(daysSavedReroute.toFixed(1)),
      effectiveLeadTime: Number(Math.max(1.5, L - daysSavedReroute).toFixed(1)),
      freightPerUnit: 7.4 * freightMultiplier,
      expeditePremiumPerUnit: 2.4 * freightMultiplier,
      handlingPerUnit: 1.65,
      slaPreservationScore: 82,
      residualExposureRatio: 0.22,
      holdingDaysAdded: 2.5
    },
    {
      id: 'alt_supplier',
      name: `Alternate Supplier (${lane.alternate_supplier})`,
      shortName: 'Alternate Supplier',
      hubUsed: lane.warehouse_hub,
      supplierUsed: lane.alternate_supplier,
      daysSaved: Number(daysSavedAltSupplier.toFixed(1)),
      effectiveLeadTime: Number(Math.max(1.2, L - daysSavedAltSupplier).toFixed(1)),
      freightPerUnit: 9.1 * freightMultiplier,
      expeditePremiumPerUnit: 3.6 * freightMultiplier,
      handlingPerUnit: 1.85,
      slaPreservationScore: 89,
      residualExposureRatio: 0.13,
      holdingDaysAdded: 3.0
    },
    {
      id: 'do_nothing',
      name: 'Do Nothing (Absorb Delay & Stockout Penalty)',
      shortName: 'Do Nothing',
      hubUsed: lane.warehouse_hub,
      supplierUsed: lane.primary_supplier,
      daysSaved: 0.0,
      effectiveLeadTime: Number(L.toFixed(1)),
      freightPerUnit: (freightRates[lane.dominant_ship_mode]?.base_per_unit || 4.2) * freightMultiplier,
      expeditePremiumPerUnit: 0.0,
      handlingPerUnit: freightRates[lane.dominant_ship_mode]?.handling_per_unit || 1.1,
      slaPreservationScore: Math.round(clamp((1 - severity) * 65, 8, 65)),
      residualExposureRatio: 1.0,
      holdingDaysAdded: 0.0
    }
  ];

  // Enrich each option with Landed Cost Delta, Extra Holding Cost, and resulting TCD
  const evaluatedOptions = rawOptions.map(opt => {
    const optionTotalFreight = orderQtyNeeded * (opt.freightPerUnit + opt.expeditePremiumPerUnit + opt.handlingPerUnit);
    // Landed Cost Delta = (freight + expedite premium + handling) of an option minus baseline
    const landedCostDelta = opt.id === 'do_nothing' ? 0 : Math.max(0, optionTotalFreight - baselineShippingCost);
    const extraHoldingCost = orderQtyNeeded * lane.holding_cost_per_unit_day * opt.holdingDaysAdded;

    const residualLostMargin = lostMargin * opt.residualExposureRatio;
    const residualSlaPenalty = slaPenalty * opt.residualExposureRatio;

    // Total Cost of Disruption (TCD) = lost margin + SLA penalties + mitigation cost + extra holding cost
    const totalCostOfDisruption = residualLostMargin + residualSlaPenalty + landedCostDelta + extraHoldingCost;

    return {
      ...opt,
      orderQtyNeeded,
      landedCostDelta: Math.round(landedCostDelta),
      extraHoldingCost: Math.round(extraHoldingCost),
      residualLostMargin: Math.round(residualLostMargin),
      residualSlaPenalty: Math.round(residualSlaPenalty),
      totalCostOfDisruption: Math.round(totalCostOfDisruption)
    };
  });

  // Weighted Ranking (Adjustable Cost vs SLA weights, default 60/40)
  const maxTcd = Math.max(...evaluatedOptions.map(o => o.totalCostOfDisruption), 1);
  const wCost = (weights.cost ?? 60) / 100;
  const wSla = (weights.sla ?? 40) / 100;

  evaluatedOptions.forEach(opt => {
    const costEfficiencyScore = clamp((1 - opt.totalCostOfDisruption / (maxTcd * 1.05)) * 100, 5, 100);
    // If lane is completely healthy (tier 0), Do Nothing is naturally preferred
    const compositeScore = isHealthy && opt.id === 'do_nothing'
      ? 98
      : (costEfficiencyScore * wCost) + (opt.slaPreservationScore * wSla);
    opt.costEfficiencyScore = Math.round(costEfficiencyScore);
    opt.compositeScore = Number(compositeScore.toFixed(1));
  });

  const rankedOptions = [...evaluatedOptions].sort((a, b) => b.compositeScore - a.compositeScore);
  const recommendedOption = rankedOptions[0];
  const doNothingOption = evaluatedOptions.find(o => o.id === 'do_nothing');

  // Two plain-sentence explanation for Scenario Planner
  const savingsVsDoNothing = Math.max(0, doNothingOption.totalCostOfDisruption - recommendedOption.totalCostOfDisruption);
  const recommendationRationale = isHealthy
    ? `Current inventory (${Math.round(stock)} units) comfortably exceeds the reorder point (${Math.round(ROP)} units), leaving zero stockout exposure across the ${L.toFixed(1)}-day lead time. Maintaining standard replenishment avoids unnecessary expedite premiums while keeping SLA compliance above target.`
    : `${recommendedOption.shortName} is recommended because it compresses effective lead time by ${recommendedOption.daysSaved} days (to ${recommendedOption.effectiveLeadTime}d) and achieves a ${recommendedOption.slaPreservationScore}% SLA preservation score under your ${weights.cost}/${weights.sla} Cost-to-SLA weighting. At a Landed Cost Delta of $${recommendedOption.landedCostDelta.toLocaleString()}, it reduces Total Cost of Disruption to $${recommendedOption.totalCostOfDisruption.toLocaleString()}—saving $${savingsVsDoNothing.toLocaleString()} in avoided lost margin and SLA penalties compared to doing nothing.`;

  // Unmitigated TCD (before agent intervention) vs Mitigated TCD (with recommended option)
  const unmitigatedTCD = doNothingOption.totalCostOfDisruption;
  const mitigatedTCD = recommendedOption.totalCostOfDisruption;

  // Alert Lead Time (days before stockout if unmitigated)
  const alertLeadTimeDays = Number(clamp(daysOfCover, 0.2, 30).toFixed(1));

  return {
    ...lane,
    d: Number(d.toFixed(2)),
    sigma_d: Number(sigma_d.toFixed(2)),
    L: Number(L.toFixed(2)),
    SS: Math.round(SS),
    ROP: Math.round(ROP),
    stock: Math.round(stock),
    daysOfCover: Number(daysOfCover.toFixed(1)),
    severity: Number(severity.toFixed(3)),
    isHealthy,
    tier,
    tierLabel,
    tierTriggerReason,
    dynamicLateProb: Number(dynamicLateProb.toFixed(3)),
    alertScore,
    shortfallUnits: Math.round(shortfallUnits),
    orderQtyNeeded,
    revenueAtRisk: Math.round(revenueAtRisk),
    lostMargin: Math.round(lostMargin),
    slaPenalty: Math.round(slaPenalty),
    landedCostDelta: isHealthy ? 0 : recommendedOption.landedCostDelta,
    extraHoldingCost: isHealthy ? 0 : recommendedOption.extraHoldingCost,
    unmitigatedTCD: Math.round(unmitigatedTCD),
    mitigatedTCD: Math.round(mitigatedTCD),
    tcdSavings: Math.round(savingsVsDoNothing),
    options: rankedOptions,
    recommendedOption,
    recommendationRationale,
    alertLeadTimeDays
  };
}

/**
 * Evaluates the entire global network across all SKU-Region lanes and computes aggregate KPIs & Region x Category Heatmap
 */
function evaluateNetwork(data, levers, stockOverrides = {}, weights = { cost: 60, sla: 40 }) {
  if (!data || !data.lanes) return null;

  const evaluatedLanes = data.lanes.map(lane =>
    evaluateLane(lane, levers, stockOverrides[lane.id], weights, data.freight_rates)
  );

  // Aggregate KPIs
  let totalUnmitigatedTCD = 0;
  let totalMitigatedTCD = 0;
  let totalRevenueAtRisk = 0;
  let totalProtectedRevenue = 0;
  let totalLandedCostDelta = 0;
  let totalLostMargin = 0;
  let totalSlaPenalty = 0;

  let tier1Count = 0;
  let tier2Count = 0;
  let tier3Count = 0;
  let healthyCount = 0;

  evaluatedLanes.forEach(l => {
    totalUnmitigatedTCD += l.unmitigatedTCD;
    totalMitigatedTCD += l.mitigatedTCD;
    totalRevenueAtRisk += l.revenueAtRisk;
    const protectedRatio = 1 - (l.recommendedOption?.residualExposureRatio ?? 0);
    totalProtectedRevenue += l.revenueAtRisk * protectedRatio;
    totalLandedCostDelta += l.landedCostDelta;
    totalLostMargin += l.lostMargin;
    totalSlaPenalty += l.slaPenalty;

    if (l.tier === 3) tier3Count++;
    else if (l.tier === 2) tier2Count++;
    else if (l.tier === 1) tier1Count++;
    else healthyCount++;
  });

  const activeAlertsCount = tier1Count + tier2Count + tier3Count;

  // Network SLA Compliance Rate (%)
  const avgSeverity = evaluatedLanes.reduce((acc, l) => acc + l.severity, 0) / evaluatedLanes.length;
  const avgLateProb = evaluatedLanes.reduce((acc, l) => acc + l.dynamicLateProb, 0) / evaluatedLanes.length;
  const unmitigatedSlaCompliance = clamp(96.4 - (avgSeverity * 38) - (avgLateProb * 12), 42.0, 98.5);
  const mitigatedSlaCompliance = clamp(unmitigatedSlaCompliance + (avgSeverity * 29.5), unmitigatedSlaCompliance, 98.8);

  // Build Region x Category matrix for Heatmap
  const regions = Array.from(new Set(evaluatedLanes.map(l => l.region))).sort();
  const categories = Array.from(new Set(evaluatedLanes.map(l => l.category))).sort();

  const heatmapMatrix = {};
  regions.forEach(r => {
    heatmapMatrix[r] = {};
    categories.forEach(c => {
      const cellLanes = evaluatedLanes.filter(l => l.region === r && l.category === c);
      if (cellLanes.length === 0) {
        heatmapMatrix[r][c] = null;
      } else {
        // Worst tier and max severity in that cell
        const sortedCell = [...cellLanes].sort((a, b) => b.tier - a.tier || b.severity - a.severity);
        const primary = sortedCell[0];
        const cellRevRisk = cellLanes.reduce((s, x) => s + x.revenueAtRisk, 0);
        const cellTcd = cellLanes.reduce((s, x) => s + x.unmitigatedTCD, 0);
        heatmapMatrix[r][c] = {
          region: r,
          category: c,
          lanes: cellLanes,
          primaryLane: primary,
          maxSeverity: primary.severity,
          isHealthy: primary.isHealthy,
          maxTier: primary.tier,
          tierLabel: primary.tierLabel,
          revenueAtRisk: cellRevRisk,
          tcd: cellTcd
        };
      }
    });
  });

  return {
    lanes: evaluatedLanes,
    regions,
    categories,
    heatmapMatrix,
    kpis: {
      totalUnmitigatedTCD: Math.round(totalUnmitigatedTCD),
      totalMitigatedTCD: Math.round(totalMitigatedTCD),
      tcdSavedByAgents: Math.round(Math.max(0, totalUnmitigatedTCD - totalMitigatedTCD)),
      totalRevenueAtRisk: Math.round(totalRevenueAtRisk),
      totalProtectedRevenue: Math.round(totalProtectedRevenue),
      slaComplianceRate: Number(unmitigatedSlaCompliance.toFixed(1)),
      mitigatedSlaComplianceRate: Number(mitigatedSlaCompliance.toFixed(1)),
      totalLandedCostDelta: Math.round(totalLandedCostDelta),
      totalLostMargin: Math.round(totalLostMargin),
      totalSlaPenalty: Math.round(totalSlaPenalty),
      activeAlertsCount,
      tier1Count,
      tier2Count,
      tier3Count,
      healthyCount
    }
  };
}

/**
 * Ghost Marker / Delta Arrow helper comparing current KPI vs pre-lever baseline KPI
 * Up bad -> Burgundy (#7f0508), Down good -> Aquamarine (#0f3f49)
 */
function DeltaBadge({ current, baseline, isCurrency = false, isPercent = false, inverseGood = false }) {
  const diff = current - baseline;
  if (Math.abs(diff) < 0.05) {
    return h('span', { style: { fontSize: '0.73rem', opacity: 0.72, fontWeight: 500 } },
      `Baseline: ${isCurrency ? '$' + baseline.toLocaleString() : baseline + (isPercent ? '%' : '')}`
    );
  }
  const isUp = diff > 0;
  // For TCD, Rev at Risk, Landed Cost, Active Alerts: UP is bad (Burgundy), DOWN is good (Aquamarine)
  // For SLA Compliance: UP is good (Aquamarine), DOWN is bad (Burgundy)
  const isBad = inverseGood ? !isUp : isUp;
  const color = isBad ? '#7f0508' : '#0f3f49';
  const arrow = isUp ? '▲' : '▼';
  const formattedDiff = isCurrency
    ? `$${Math.abs(Math.round(diff)).toLocaleString()}`
    : isPercent
      ? `${Math.abs(diff).toFixed(1)}%`
      : Math.abs(Math.round(diff)).toLocaleString();
  const formattedBase = isCurrency
    ? `$${Math.round(baseline).toLocaleString()}`
    : isPercent
      ? `${baseline.toFixed(1)}%`
      : Math.round(baseline).toLocaleString();

  return h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.45rem', marginTop: '0.3rem', fontSize: '0.74rem' } },
    h('span', {
      style: {
        color: isBad ? '#ece6df' : '#0f3f49',
        backgroundColor: isBad ? '#7f0508' : 'rgba(15, 63, 73, 0.14)',
        padding: '0.1rem 0.42rem',
        borderRadius: '2px',
        fontWeight: 700
      }
    }, `${arrow} ${isUp ? '+' : '-'}${formattedDiff}`),
    h('span', { style: { opacity: 0.75, fontSize: '0.7rem' } }, `Ghost Base: ${formattedBase}`)
  );
}

/**
 * Interactive SVG Horizontal / Vertical Bar Chart (for Scenario Planner & Tornado Sensitivity)
 */
function EditorialBarChart({ items, maxVal, valuePrefix = '$', valueSuffix = '', height = 220 }) {
  const safeMax = Math.max(maxVal, 1);
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.75rem', padding: '0.5rem 0' } },
    items.map((item, idx) => {
      const pct = clamp((Math.abs(item.value) / safeMax) * 100, 3, 100);
      const isAlert = item.isHighlight || item.isBad;
      return h('div', { key: idx, style: { display: 'flex', flexDirection: 'column', gap: '0.25rem' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '0.78rem', fontWeight: 600 } },
          h('span', null, item.label),
          h('span', { className: 'kpi-number', style: { fontSize: '0.9rem', color: isAlert ? '#7f0508' : '#0f3f49' } },
            `${valuePrefix}${item.value.toLocaleString()}${valueSuffix}`
          )
        ),
        h('div', { style: { width: '100%', height: '18px', backgroundColor: 'rgba(15, 63, 73, 0.1)', borderRadius: '2px', overflow: 'hidden', position: 'relative' } },
          h('div', {
            style: {
              width: `${pct}%`,
              height: '100%',
              backgroundColor: item.color || (isAlert ? '#7f0508' : '#0f3f49'),
              transition: 'width 0.2s ease'
            }
          })
        ),
        item.subLabel && h('div', { style: { fontSize: '0.68rem', opacity: 0.75 } }, item.subLabel)
      );
    })
  );
}

        rawData.lanes.forEach(lane => {

          let updated = Math.max(0, currentStock - dEffective * 0.28);
          // If stock hits 0, simulate partial emergency replenishment arrival so simulation stays lively
          if (updated <= 2) {

        const next = { ...prev };
        keys.forEach(k => {
          const item = next[k];

            if (item.remainingSec > 1) {
              next[k] = { ...item, remainingSec: item.remainingSec - 1 };

    }, 1000);
    return () => clearInterval(timer);

    // Bottom of track = 0 days, Top of track = +15 days

          ),
          h('p', { style: { fontSize: '0.84rem', marginTop: '0.4rem', opacity: 0.9 } },
            'Every number in Project Resilience Engine traces directly to empirical DataCo Global records or an explicitly documented, seeded synthetic inventory layer (seed = 42).'
          ),

          h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.2rem', marginTop: '1rem' } },
            // Empirical DataCo Lineage
            h('div', { className: 'concrete-card-light' },
              h('h3', { className: 'serif-title', style: { fontSize: '1.1rem', marginBottom: '0.5rem' } },
                '1. Empirical Layer (DataCo Smart Supply Chain CSV)'
              ),
              h('ul', { style: { paddingLeft: '1.1rem', fontSize: '0.78rem', display: 'flex', flexDirection: 'column', gap: '0.35rem' } },
                h('li', null, h('strong', null, 'Source File: '), `${rawData.metadata.source_dataset} (${rawData.model_metrics.date_range})`),
                h('li', null, h('strong', null, 'Real Columns Used: '), 'order date (DateOrders), shipping date (DateOrders), Days for shipping (real), Days for shipment (scheduled), Late_delivery_risk, Order Region, Market, Shipping Mode, Product Name, Category Name, Order Item Quantity, Order Item Product Price, Sales, Order Profit Per Order.'),
                h('li', null, h('strong', null, 'Engineered Feature: '), 'delay_delta = Days for shipping (real) − Days for shipment (scheduled).'),
                h('li', null, h('strong', null, 'Aggregation Strategy: '), 'Aggregated 180,519 raw rows into 136 high-volume Product × Region SKU lanes across 10 global regions and 10 categories (169.8 KB JSON) for sub-5ms browser interactivity.')
              )
            ),

            // Synthetic Layer
            h('div', { className: 'concrete-card-light' },
              h('h3', { className: 'serif-title', style: { fontSize: '1.1rem', marginBottom: '0.5rem' } },
                '2. Seeded Synthetic Layer (Seed = 42)'
              ),
              h('ul', { style: { paddingLeft: '1.1rem', fontSize: '0.78rem', display: 'flex', flexDirection: 'column', gap: '0.35rem' } },
                h('li', null, h('strong', null, 'Stock on Hand: '), 'Seeded relative to baseline ROP (76% Healthy above ROP, 15% near Watch, 7% near Critical, 2% Emergency) so pulling the Disruption Lever smoothly cascades lanes through Tiers 1 → 2 → 3.'),
                h('li', null, h('strong', null, 'Warehouses & Suppliers: '), '10 regional primary fulfillment hubs, 10 backup hubs, and 20 primary/alternate suppliers with baseline reliability (86%–96%).'),
                h('li', null, h('strong', null, 'Freight & Expedite Rates: '), 'Standard ($4.20/u), Second Class ($6.80/u), First Class ($11.50/u), Air Expedite ($19.80/u + $9.20 expedite premium + $2.60 handling).'),
                h('li', null, h('strong', null, 'SLA Penalty & Approval Gate: '), 'Regional SLA penalty rate (7.0%–9.5% of late order value). HOD PO sign-off required above $25,000.'),
                h('li', null, h('strong', null, 'Staff Directory: '), '30 fictional regional contacts (Supervisor, Manager, HOD per region) with emails and Slack handles.')
              )
            )
          )
        ),

        // Core Formulas & ML Model Validation
        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' } },
          h('div', { className: 'concrete-card' },
            h('h3', { className: 'serif-title', style: { fontSize: '1.15rem', marginBottom: '0.5rem' } },
              '3. Exact Mathematical Formulas (Client-Side Engine)'
            ),
            h('table', { className: 'editorial-table' },
              h('thead', null,
                h('tr', null, h('th', null, 'Metric'), h('th', null, 'Exact Formula Implemented'))
              ),
              h('tbody', null,
                [
                  ['Safety Stock (SS)', 'SS = z · σ_d · √L  (default z = 1.65)'],
                  ['Reorder Point (ROP)', 'ROP = d · L + SS'],
                  ['Days of Cover', 'Days of Cover = stock / d'],
                  ['Severity Score (s)', 's = clamp(1 − stock / ROP, 0, 1)'],
                  ['Revenue at Risk', 'max(0, d · L − stock) × unit_price'],
                  ['SLA Penalty', 'penalty_rate × value_of_orders_expected_late'],
                  ['Landed Cost Delta', '(freight + expedite_premium + handling) − baseline'],
                  ['Total Cost of Disruption', 'lost_margin + sla_penalties + mitigation_cost + extra_holding_cost']
                ].map(([m, f]) => h('tr', { key: m },
                  h('td', { style: { fontWeight: 700 } }, m),
                  h('td', { style: { fontFamily: 'monospace', fontSize: '0.76rem' } }, f)
                ))
              )
            )
          ),

          h('div', { className: 'concrete-card' },
            h('h3', { className: 'serif-title', style: { fontSize: '1.15rem', marginBottom: '0.5rem' } },
              '4. Late Delivery Risk Model Performance & Limitations'
            ),
            h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.6rem', marginBottom: '0.75rem' } },
              h('div', { className: 'concrete-card-light', style: { textAlign: 'center' } },
                h('div', { style: { fontSize: '0.68rem', fontWeight: 700 } }, 'GB ACCURACY'),
                h('div', { className: 'kpi-number', style: { fontSize: '1.4rem' } }, `${(rawData.model_metrics.gb_accuracy * 100).toFixed(2)}%`)
              ),
              h('div', { className: 'concrete-card-light', style: { textAlign: 'center' } },
                h('div', { style: { fontSize: '0.68rem', fontWeight: 700 } }, 'LOGISTIC REG'),
                h('div', { className: 'kpi-number', style: { fontSize: '1.4rem' } }, `${(rawData.model_metrics.lr_accuracy * 100).toFixed(2)}%`)
              ),
              h('div', { className: 'concrete-card-light', style: { textAlign: 'center' } },
                h('div', { style: { fontSize: '0.68rem', fontWeight: 700 } }, 'ROC-AUC SCORE'),
                h('div', { className: 'kpi-number', style: { fontSize: '1.4rem' } }, rawData.model_metrics.roc_auc)
              )
            ),
            h('p', { style: { fontSize: '0.78rem', lineHeight: 1.5 } },
              'Features: Order Region, Shipping Mode, Days for shipment (scheduled), and Category Name. Trained on 36,000 stratified transactions and validated on 9,000 holdout transactions (Precision: 84.1%). Limitations: Historical DataCo records do not capture external weather/port telemetry or multi-echelon BOM dependencies; hence transit shocks are injected via the interactive Disruption Lever.'
            )
          )
        )
      )
    ),

    // TIER 3 DRAFT PO APPROVAL MODAL
    activePoModal && h('div', {
      style: {
        position: 'fixed',
        inset: 0,
        backgroundColor: 'rgba(10, 43, 50, 0.82)',
        zIndex: 10000,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        padding: '1.5rem'
      }
    },
      h('div', {
        className: 'concrete-card',
        style: {
          maxWidth: '580px',
          width: '100%',
          border: '3px solid #7f0508',
          boxShadow: '0 16px 40px rgba(0,0,0,0.5)'
        }
      },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '2px solid #0f3f49', paddingBottom: '0.5rem' } },
          h('span', { className: 'tier-badge tier-badge-3' }, 'TIER 3 · AUTO-DRAFTED EXPEDITED PURCHASE ORDER'),
          h('button', {
            className: 'btn-editorial',
            style: { padding: '0.2rem 0.5rem' },
            onClick: () => setActivePoModal(null)
          }, '✕ Close')
        ),
        h('h3', { className: 'serif-title', style: { fontSize: '1.35rem', marginTop: '0.6rem' } },
          `${activePoModal.poNumber} — ${activePoModal.product}`
        ),
        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.6rem', marginTop: '0.75rem', fontSize: '0.8rem', backgroundColor: '#f5f1ec', padding: '0.85rem', borderRadius: '2px' } },
          h('div', null, h('strong', null, 'Region / Hub: '), `${activePoModal.region} (${activePoModal.destinationHub})`),
          h('div', null, h('strong', null, 'Vendor: '), activePoModal.vendor),
          h('div', null, h('strong', null, 'Mitigation Mode: '), activePoModal.mitigationMode),
          h('div', null, h('strong', null, 'Expedited Lead Time: '), `${activePoModal.leadTimeDays} Days`),
          h('div', null, h('strong', null, 'Order Quantity: '), `${activePoModal.quantity.toLocaleString()} units`),
          h('div', null, h('strong', null, 'Landed Cost Delta: '), `$${activePoModal.landedCostDelta.toLocaleString()}`),
          h('div', null, h('strong', null, 'Total PO Value: '), h('span', { style: { color: '#7f0508', fontWeight: 800 } }, `$${activePoModal.totalPoValue.toLocaleString()}`)),
          h('div', null, h('strong', null, 'TCD Protected: '), `$${(activePoModal.tcdProtected || 0).toLocaleString()}`)
        ),
        activePoModal.requiresHodApproval && h('div', {
          style: {
            marginTop: '0.75rem',
            padding: '0.55rem 0.75rem',
            backgroundColor: 'rgba(127, 5, 8, 0.14)',
            borderLeft: '4px solid #7f0508',
            fontSize: '0.76rem',
            fontWeight: 700,
            color: '#7f0508'
          }
        }, `GOVERNANCE GATE: PO value exceeds $${activePoModal.hodLimit.toLocaleString()} limit. Requires ${activePoModal.approverRole} authorization.`),
        h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: '0.65rem', marginTop: '1rem' } },
          h('button', {
            className: 'btn-editorial',
            onClick: () => handlePoDecision(activePoModal.poNumber, 'REJECTED')
          }, 'Reject Draft PO'),
          h('button', {
            className: 'btn-burgundy',
            onClick: () => handlePoDecision(activePoModal.poNumber, 'APPROVED')
          }, activePoModal.requiresHodApproval ? 'Approve as HOD & Dispatch PO' : 'Approve & Dispatch PO')
        )
      )
    )
  );
}

    const rootEl = document.getElementById('root');
    if (rootEl) {
      const root = createRoot(rootEl);
      root.render(React.createElement(App));
    }
  </script>
</body>
</html>
